<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bahçe Takip Sistemi</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #f0f7f0;
      font-family: "Segoe UI", sans-serif;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      align-items: start;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h1, h2 {
      color: #2d5a27;
      margin-top: 0;
    }

    .form-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #4CAF50;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #45a049;
    }

    #sonuc, #bildirimler {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #f7fff7;
      border: 1px solid #d8ead8;
    }

    #gardenList {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .garden-card {
      background: #f9fff9;
      border: 1px solid #d8ead8;
      border-radius: 12px;
      padding: 15px;
    }

    .garden-card h3 {
      margin-top: 0;
      color: #2d5a27;
    }

    .garden-card p {
      margin: 6px 0;
    }

    .garden-card button {
      margin-top: 10px;
      margin-right: 8px;
    }

    .garden-card button:nth-of-type(1) {
      background: #3498db;
    }

    .garden-card button:nth-of-type(2) {
      background: #f39c12;
    }

    .garden-card button:nth-of-type(3) {
      background: #8e44ad;
    }

    .garden-card button:nth-of-type(4) {
      background: #d9534f;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <h1>🌿 Bahçe Takip Sistemi</h1>

      <div class="form-box">
        <input type="text" id="search" placeholder="Bitki adı gir">
        <input type="text" id="city" placeholder="Şehir gir">
        <input type="date" id="ekimTarihi">

        <div class="button-row">
          <button onclick="bitkiAra()">Ara</button>
          <button onclick="bitkiEkle()">Bitkiyi Bahçeye Ekle</button>
        </div>
      </div>

      <div id="sonuc">Henüz işlem yapılmadı.</div>
      <div id="bildirimler">Henüz bir bildirim yok.</div>
    </div>

    <div class="panel">
      <h2>Bahçem</h2>
      <div id="gardenList"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
